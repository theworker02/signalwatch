name: Dashboard screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'scripts/capture_screenshots.py'
      - '.github/workflows/screenshots.yml'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate labeled UI previews
        run: python scripts/capture_screenshots.py
      - name: Commit screenshots when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "docs: refresh labeled dashboard preview screenshots"
            git push
          fi
