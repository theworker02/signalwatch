services:
  signalwatch:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SIGNALWATCH_DATA_DIR: /app/data
      SIGNALWATCH_BACKGROUND: "1"
      SIGNALWATCH_POLL_SECONDS: "300"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
